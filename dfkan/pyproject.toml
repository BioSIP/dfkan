[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dfkan"
version = "0.1.0"
description = "DualFlex KAN – Kolmogorov-Arnold Network library with flexible polynomial activations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "dill",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dfkan*"]
